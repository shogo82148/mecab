name: mecab on MinGW

on:
  pull_request:
    paths:
      - ".github/workflows/test-mingw.yml"
      - "mecab/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-mingw.yml"
      - "mecab/**"

jobs:
  test:
    name: Test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          install: >
            autoconf-wrapper
            automake-wrapper
            autotools
            bison
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-libiconv
      - name: configure
        run: |
          ./autogen.sh
          ./configure --host=x86_64-w64-mingw32
        shell: msys2 {0}
        working-directory: mecab
      - name: make
        run: |
          make all
          make check
          make install
        shell: msys2 {0}
        working-directory: mecab

      - name: build ipadic
        run: |
          ./autogen.sh
          ./configure --with-charset=utf8
          make all
          make install
        shell: msys2 {0}
        working-directory: mecab-ipadic
